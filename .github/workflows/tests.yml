# MedAgentPro - tests (classic test set, item 7). Linux only: Windows minutes cost twice as much, and
# the repository belongs to another owner.
#
# No secret of any kind: no API key, no model call at any step (book 6.1). The first step fails if
# ANTHROPIC_API_KEY exists in the environment, and tests/ci/test_no_key.py checks the same from pytest.
# Blocking: the tests with coverage at 92% (fail_under in pyproject.toml), ruff, bandit, pip-audit on the
# installed environment. mypy reports without blocking until after task 7.

name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"        # daily: the load and concurrency tests, and property tests at full size
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI: tests never reach a real model (book 6.1)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m demo_data.seed
      - name: tests, with branch coverage (fails under 92%)
        run: python -m pytest -q --cov --cov-branch --cov-report=term
      - run: python -m ruff check .
      - run: python -m bandit -c pyproject.toml -r . -q
      - name: pip-audit (the installed environment; -r builds a second one and takes minutes)
        run: python -m pip_audit
      - name: mypy (reports, does not block until after task 7)
        continue-on-error: true
        run: python -m mypy

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m demo_data.seed
      - run: python -m pytest -m stress -q

  # The chat screen (task 7): types, lint, component tests. No server, no key.
  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # the route types (LayoutProps) that next dev or next build would generate; a clean checkout has none
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npm audit --omit=dev

  # End to end: the screen against the server on the scripted model (book 6.1: never a real model)
  # Test 38 (NFR 22): every flow on Chromium, Firefox and WebKit, as both demo roles, on the built screen.
  # Test 40 (NFR 24): keyboard alone, contrast on every state, and grayscale captures kept for review.
  # Then the real-model path with a fake provider: no key, no network (backend/tools/fake_real_server.py)
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: the scripted model, three engines
        run: npx playwright test
        working-directory: frontend
      - name: keep the grayscale captures (Test 40)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grayscale
          path: frontend/test-results/grayscale/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
      - name: the real-model path with a fake provider, three engines
        if: ${{ !cancelled() }}   # runs even when the step before failed: the whole picture in one run
        run: npx playwright test -c playwright.real.config.ts
        working-directory: frontend
