# MedAgentPro - tests (classic test set, item 7). Linux only: Windows minutes cost twice as much, and
# the repository belongs to another owner.
#
# No secret of any kind: no API key, no model call at any step (book 6.1). The first step fails if
# ANTHROPIC_API_KEY exists in the environment, and tests/ci/test_no_key.py checks the same from pytest.
# Blocking: the tests with coverage at 92% (fail_under in pyproject.toml), ruff, bandit, pip-audit on the
# installed environment, and mypy (blocking since Phase B, 19.10, at zero errors). The real gateway refuses
# to build where CI is set (model_client/budget.py, tests/ci/test_no_key.py).
#
# Runners are pinned to ubuntu-24.04: ubuntu-latest moves to 26 on 19.10, which changes what
# `playwright install --with-deps` installs (WebKit most of all), and that is before the demo. Revisit
# after the demo, with the actions' major versions (CLAUDE.md, after the demo).

name: tests

on:
  # push only on master (Evyatar, 20.10, 18:56): a branch with a pull request ran every job twice, once for
  # push and once for pull_request. A branch is tested by its pull request
  push:
    branches: [master]
  pull_request:
  # schedule and workflow_dispatch run only where this file is on the default branch. The default
  # branch is main, which holds only the README, so neither runs today; stress runs on every pull
  # request instead (see the stress job). Both stay, in case master becomes the default
  schedule:
    - cron: "0 3 * * *"        # daily: the load and concurrency tests, and property tests at full size
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch or pull request cancels the run still going for the old one
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI: tests never reach a real model (book 6.1)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m demo_data.seed
      - name: tests, with branch coverage (fails under 92%)
        run: python -m pytest -q --cov --cov-branch --cov-report=term
      - run: python -m ruff check .
      # Code rules (Evyatar, 21.10 21:25): a module, class or function this change writes or touches without a
      # docstring is shown as a warning, never a failure, until the retrofit (96R_RETROFIT_LOG.md) is done.
      # On the merge commit a pull request checks out, the base branch's tip against HEAD is exactly the change
      - name: docstrings on the files this change touches (pydocstyle D1, a warning)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}" HEAD -- . ':!tests' \
                  | grep '\.py$' | sed 's#^backend/##' || true)
          if [ -z "$files" ]; then echo "no Python file of backend/ outside tests/ changed"; exit 0; fi
          python -m ruff check --select D100,D101,D102,D103,D104,D106 --output-format github --exit-zero $files \
            | sed 's/^::error/::warning/'
      - name: pip-audit (the installed environment; -r builds a second one and takes minutes)
        run: python -m pip_audit
      - name: mypy (blocking since Phase B, 19.10)
        run: python -m mypy

  # On every pull request (to master; main stays the default branch), and on the schedule and by hand where
  # those can run. Blocking like the other jobs: about 45 s locally (14.10)
  stress:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m demo_data.seed
      - run: python -m pytest -m stress -q

  # The chat screen (task 7): types, lint, component tests. No server, no key.
  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # the route types (LayoutProps) that next dev or next build would generate; a clean checkout has none
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npm audit --omit=dev

  # End to end: the screen against the server on the scripted model (book 6.1: never a real model)
  # Test 38 (NFR 22): every flow on Chromium, Firefox and WebKit, as both demo roles, on the built screen.
  # Test 40 (NFR 24): keyboard alone, contrast on every state, and grayscale captures kept for review.
  # Then the real-model path with a fake provider: no key, no network (backend/tools/fake_real_server.py)
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: No API key in this environment
        working-directory: .
        run: |
          if [ -n "${ANTHROPIC_API_KEY+set}" ]; then
            echo "ANTHROPIC_API_KEY must not exist in CI"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: the scripted model, three engines
        run: npx playwright test
        working-directory: frontend
      - name: keep the grayscale captures (Test 40)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grayscale
          path: frontend/test-results/grayscale/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
      - name: the real-model path with a fake provider, three engines
        if: ${{ !cancelled() }}   # runs even when the step before failed: the whole picture in one run
        run: npx playwright test -c playwright.real.config.ts
        working-directory: frontend
