[pytest]
pythonpath = .
testpaths = tests
markers =
    stress: load and concurrency tests, run apart with  python -m pytest -m stress
    asked_as_written: task 4, A: the intent outputs keep their own asked; conftest's whole_question_asked is off
    property: property-based tests (hypothesis); in every run, and with many more examples under -m stress
addopts = -m "not stress"
